<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <title>Samples Placement - VeriPixel</title>
        <link rel="stylesheet"
              href="style.css">
    </head>

    <body>
        <img id="targetImage"
            class="targetImage"
            src="sample.jpg"
            width="1800"
            height="1500"
            alt="Reference sample image">
        <div class="samples">
            <div class="samples__wrapper">
                <div class="samples__top">
                    <div class="sample__left">
                        <div class="sample__target"></div>
                    </div>
                    <div class="sample__center">
                        <div class="sample__target"></div>
                    </div>
                    <div class="sample__right">
                        <div class="sample__target"></div>
                    </div>
                </div>
                <div class="samples__middle">
                    <div class="sample__left">
                        <div class="sample__target"></div>
                    </div>
                    <div class="sample__center">
                        <div class="sample__target"></div>
                    </div>
                    <div class="sample__right">
                        <div class="sample__target"></div>
                    </div>
                </div>
                <div class="samples__bottom">
                    <div class="sample__left">
                        <div class="sample__target"></div>
                    </div>
                    <div class="sample__center">
                        <div class="sample__target"></div>
                    </div>
                    <div class="sample__right">
                        <div class="sample__target"></div>
                    </div>
                </div>
            </div>
        </div>
    </body>

</html>
